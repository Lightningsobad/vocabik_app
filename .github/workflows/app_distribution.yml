name: App Distribution Pipeline

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Ghi chú cho bản test (Release Notes)'
        required: false
        default: 'Manual test build triggered via GitHub Actions'
        type: string

concurrency:
  group: app-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute-android:
    name: Build & Distribute Android Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis (Lint)
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vocabik-test-apk-run-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Distribute APK to Firebase App Distribution
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID || '1:621884720913:android:556ccdf3cab9f4e87d6eb0' }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ inputs.release_notes || github.event.head_commit.message || 'Automated test build after merge' }}
